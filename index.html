<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>png2svg</title>
  </head>
  <body>
    <main id="app">
      <h1>png2svg</h1>
      <div id="dropzone" tabindex="0">Drop a PNG here or click to choose</div>
      <input id="file" type="file" accept="image/png" hidden />
      <div class="controls">
        <label>Colors <input id="colors" type="number" value="16" min="2" max="64" /></label>
        <label>Smoothing <input id="blur" type="number" value="1" min="0" max="5" /></label>
        <button id="download" disabled>Download SVG</button>
      </div>
      <div class="preview">
        <img id="before" alt="original preview" />
        <div id="after"></div>
      </div>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
